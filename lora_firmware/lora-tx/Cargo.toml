[package]
name = "lora-tx"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lora-tx"
path = "src/main.rs"

[dependencies]
lr1121 = { path = "../lr1121" }
log = "0.4"
esp-idf-hal = "0.46"
esp-idf-svc = { version = "0.52", features = ["alloc"] }
esp-idf-sys = { version = "0.37", features = ["binstart"] }
esp32-nimble = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.21"

[build-dependencies]
embuild = "0.33"

[package.metadata.esp-idf-sys]
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults"]
